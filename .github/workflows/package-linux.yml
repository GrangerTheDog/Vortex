name: Package Linux

# Builds an unsigned Linux AppImage. Every push to master and every manual run
# uploads it as a workflow artifact and refreshes the rolling "linux-nightly"
# pre-release. Pushing a linux-v* tag (e.g. linux-v1.0.0) publishes a full
# release marked as the repository's latest; a v* tag attaches the AppImage to
# that tag's release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The version to build (eg: 'v1.0.0'). Leave empty for a nightly version."
        required: false
        type: string
        default: ""
  push:
    branches: [master]
    tags: ["v*", "linux-v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    runs-on: ubuntu-22.04 # oldest supported glibc, so the AppImage runs on more distros
    permissions:
      contents: write # attaching the AppImage to a tag's release
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: "recursive"

      - name: Set version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          raw="$INPUT_VERSION"
          if [ -z "$raw" ] && [ "$REF_TYPE" = "tag" ]; then
            raw="${REF_NAME#linux-}"
          fi
          if [ -z "$raw" ]; then
            base=$(node -p "require('./package.json').version")
            raw="$base-nightly.$(date +%Y%m%d).${{ github.run_number }}"
          fi
          echo "raw=${raw#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # NOTE(erri120): fontconfig required by font-scanner required by theme-switcher
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Install pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Bump versions
        run: pnpm -F "@vortex/main" -F "@nexusmods/vortex-api" version ${{ steps.version.outputs.raw }} --no-git-tag-version --no-git-checks --allow-same-version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          VORTEX_ELECTRON_REBUILD: "defer"

      - name: Build workspace
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Publish dist package
        run: pnpm nx run @vortex/main:publish
        env:
          NODE_ENV: production
          VORTEX_ELECTRON_REBUILD: "skip"

      - name: Rebuild packaged Electron native modules
        working-directory: src/main/dist
        env:
          # dist is a pnpm deploy artifact: its lockfile carries the workspace catalogs
          # but the generated workspace file doesn't, so pnpm's pre-run install fails.
          PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN: "false"
        run: pnpm exec electron-rebuild

      - name: Build AppImage
        run: pnpm -F @vortex/main run package:nosign
        env:
          # On CI, electron-builder hardlinks files into linux-unpacked; a file it
          # visits twice (winapi.node) then fails with EEXIST instead of being overwritten
          USE_HARD_LINKS: "false"

      - name: Validate package
        run: |
          ls -la dist
          test -n "$(ls dist/vortex-*.AppImage 2>/dev/null)" || { echo "::error::AppImage not found in ./dist/"; exit 1; }
          node scripts/verify-packaged-asar.mjs --asar dist/linux-unpacked/resources/app.asar

      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: vortex-${{ steps.version.outputs.raw }}-linux
          path: dist/vortex-*.AppImage
          if-no-files-found: error
          retention-days: 30

      # Branch builds replace one rolling pre-release, so the newest AppImage is
      # always at the same place without piling up releases.
      - name: Publish Linux nightly pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.raw }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh release delete linux-nightly --cleanup-tag --yes || true
          gh release create linux-nightly dist/vortex-*.AppImage \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Linux nightly ($VERSION)" \
            --notes "Unsigned Linux AppImage built from \`$BRANCH\` at $GITHUB_SHA. Replaced on every build.

          Make it executable and run it: \`chmod +x vortex-*.AppImage && ./vortex-*.AppImage\`. AppImages need FUSE 2 (\`fuse2\` on Arch, \`libfuse2\` on Debian/Ubuntu)."

      - name: Publish Linux release
        if: github.ref_type == 'tag' && startsWith(github.ref_name, 'linux-v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/vortex-*.AppImage
          prerelease: false
          make_latest: "true"
          name: Vortex for Linux ${{ steps.version.outputs.raw }}
          tag_name: ${{ github.ref_name }}
          body: |
            Linux build of this Vortex fork: Steam games under Proton, starting with Fallout 4.
            See [LINUX_HANDOFF.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/LINUX_HANDOFF.md) for what works and what's still open.

            **Install:** download `vortex-*.AppImage` below, then run
            `chmod +x vortex-*.AppImage && ./vortex-*.AppImage`.
            AppImages need FUSE 2 (`fuse2` on Arch, `libfuse2` on Debian/Ubuntu).
            FOMOD installers need the .NET 9 runtime (`dotnet-runtime-9.0`).

            Unofficial and unsigned; not a Nexus Mods release.

      - name: Attach to release
        if: github.ref_type == 'tag' && !startsWith(github.ref_name, 'linux-v')
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/vortex-*.AppImage
          prerelease: ${{ contains(steps.version.outputs.raw, '-') }}
          name: ${{ steps.version.outputs.raw }}
          tag_name: ${{ github.ref_name }}
